server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8080;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
