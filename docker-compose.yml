services:
  # -------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3
  # -------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: ancu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ancu}
      POSTGRES_USER: ${DB_USER:-ancu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ancu} -d ${DB_NAME:-ancu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Valhalla routing engine (tự host)
  # Dữ liệu OSM đặt trong infra/valhalla/data/
  # Lần đầu chạy: cần build tiles trước (xem README)
  # -------------------------------------------------------
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: ancu_valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./infra/valhalla:/custom_files
    environment:
      - use_tiles_ignore_pbf=True  # dùng tiles đã build sẵn nếu có
      - serve_tiles=True
      - build_admins=False
      - build_time_zones=False
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    profiles: [app]
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: ${APP_DB_HOST:-db}
      DB_PORT: ${APP_DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ancu}
      DB_USER: ${DB_USER:-ancu}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      VALHALLA_URL: http://valhalla:8002
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://air-quality-api.open-meteo.com}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/health]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  web:
    profiles: [app]
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

